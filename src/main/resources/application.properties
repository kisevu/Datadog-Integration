spring.application.name=Datadog-integration

management.endpoints.web.exposure.exclude=*
management.metrics.export.datadog.enabled=true
management.metrics.export.datadog.api-key=${API_KEY}
management.datadog.metrics.export.apiKey=${API_KEY}
management.metrics.export.datadog.step=15s
management.metrics.tags.application=Datadog-integration
